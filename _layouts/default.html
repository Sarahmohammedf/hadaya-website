<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}" dir="{{ page.dir | default: 'ltr' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7C3AED">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎁</text></svg>">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="{{ '/' | relative_url }}">
        <span class="logo-mark">🎁</span>
        <span class="logo-text">
          <span class="logo-en">Hadaya</span>
          <span class="logo-ar">هدايا</span>
        </span>
      </a>
      <nav class="site-nav">
        <a href="{{ '/support' | relative_url }}">Support</a>
        <a href="{{ '/privacy' | relative_url }}">Privacy</a>
        <a href="{{ '/terms' | relative_url }}">Terms</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    <div class="container content-card">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <span class="logo-mark">🎁</span>
        <span>Hadaya — هدايا</span>
      </div>
      <div class="footer-links">
        <a href="mailto:{{ site.support_email }}">{{ site.support_email }}</a>
        <span class="dot">·</span>
        <a href="mailto:{{ site.privacy_email }}">{{ site.privacy_email }}</a>
      </div>
      <div class="footer-copy">© 2026 Hadaya. All rights reserved. · جميع الحقوق محفوظة.</div>
    </div>
  </footer>
</body>
</html>
